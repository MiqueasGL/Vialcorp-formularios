<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTP aplicables al Contrato</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: #f4f4f4;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    #searchBar {
      width: 100%;
      padding: 0.5rem;
      margin: 1rem 0;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .person-card {
      background-color: #fff;
      padding: 1rem;
      margin: 0.5rem 0;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .person-card div {
      display: flex;
      gap: 6px;
    }
    .person-card a {
      padding: 0.5rem 1rem;
      background-color: #0078D4;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.2s;
    }
    .person-card a:hover {
      background-color: #005a9e;
    }
    .person-card a.pdf-btn {
      background-color: #28a745;
    }
    .person-card a.pdf-btn:hover {
      background-color: #1e7e34;
    }
    .back {
      display: block;
      margin: 2rem auto;
      text-align: center;
    }
    .back a {
      color: #0078D4;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>ARTP aplicables al Contrato</h1>

  <div class="person-card">
    <span>Conduccion interior Mina</span>
    <div>
      <a href="https://vialcorp.sharepoint.com/:b:/s/GERENCIAOPERACIONES/IQDBIsuAc3zrQ5DTboxAsTJDAVFXD46xP-jJWoXrIpJ28bI?e=VduRDW" target="_blank" class="pdf-btn">Ver y descargar</a>
    </div>
  </div>

  <div class="person-card">
    <span>Aplicacion de supresor de polvo con camion aljibe</span>
    <div>
      <a href="https://vialcorp.sharepoint.com/:b:/s/GERENCIAOPERACIONES/IQCFWaHhLltWTZMvXzqtWX6MATBHs78pzEnpjo2w_ZH7mdA?e=YrjQkL" target="_blank" class="pdf-btn">Ver y descargar</a>
    </div>
  </div>

  <div class="person-card">
    <span>Cambio de neumatico en terreno</span>
    <div>
      <a href="https://vialcorp.sharepoint.com/:b:/s/GERENCIAOPERACIONES/IQAeQDI_irjpTIsYcC6GEfvVAUlFmZPAOeb5iNgiN_pa7pY?e=mtwfnP" target="_blank" class="pdf-btn">Ver y descargar</a>
    </div>
  </div>

  <div class="back">
    <a href="https://linktr.ee/CC245">← Volver a la pagina principal</a>
  </div>

  <script>
    function filterNames() {
      const query = document.getElementById('searchBar').value.toLowerCase();
      const cards = document.querySelectorAll('.person-card');
      cards.forEach(card => {
        const fullName = card.querySelector('span').textContent.toLowerCase();
        card.style.display = fullName.includes(query) ? 'flex' : 'none';
      });
    }
  </script>
</body>
</html>
